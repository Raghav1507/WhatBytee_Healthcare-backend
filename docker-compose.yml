# Local PostgreSQL for the healthcare backend.
#
#   docker compose up -d
#
# Connection settings match `.env.example` (host port 5432 by default;
# change the left-hand side of the ports mapping if 5432 is taken).
services:
  db:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-healthcare_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - healthcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-healthcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthcare_pgdata:
